# cargo-deny 0.20 policy. Reviewed dependency surface for a value-bearing binary.
# See docs/AQUA_WORK_ORDER.md W0.
# cargo-deny 0.16 cannot parse CVSS 4.0 rustsec advisories (RUSTSEC-2026-0066).

[advisories]
yanked = "deny"
# Transitive unmaintained crates (today: `paste` via alloy-primitives) are
# Alloy's surface, not ours. Workspace crates going unmaintained still fail.
unmaintained = "workspace"
unsound = "workspace"
# No blanket ignores. An ignored advisory needs a dated comment and a reviewer.
ignore = []

[licenses]
# Permissive only. A copyleft or unknown license is a review decision, not a
# silent dependency addition.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Hard technology boundary from docs/ALLOY.md: Alloy is the EVM stack.
# ethers-rs is deprecated and must never enter this workspace.
deny = [
  { crate = "ethers", reason = "docs/ALLOY.md: ethers-rs is deprecated" },
  { crate = "ethers-core" },
  { crate = "ethers-providers" },
  { crate = "ethers-signers" },
  { crate = "ethers-contract" },
  { crate = "ethers-middleware" },
  { crate = "web3" },
  # Hand-rolled crypto/RLP/signing surfaces are Alloy's job, not ours.
  { crate = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# A live trading binary never builds from a floating git revision.
allow-git = []

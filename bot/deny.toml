# cargo-deny policy. Reviewed dependency surface for a value-bearing binary.
# See docs/AQUA_WORK_ORDER.md W0.

[advisories]
version = 2
yanked = "deny"
# No blanket ignores. An ignored advisory needs a dated comment and a reviewer.
ignore = []

[licenses]
version = 2
# Permissive only. A copyleft or unknown license is a review decision, not a
# silent dependency addition.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Hard technology boundary from docs/ALLOY.md: Alloy is the EVM stack.
# ethers-rs is deprecated and must never enter this workspace.
deny = [
  { name = "ethers" },
  { name = "ethers-core" },
  { name = "ethers-providers" },
  { name = "ethers-signers" },
  { name = "ethers-contract" },
  { name = "ethers-middleware" },
  { name = "web3" },
  # Hand-rolled crypto/RLP/signing surfaces are Alloy's job, not ours.
  { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# A live trading binary never builds from a floating git revision.
allow-git = []
